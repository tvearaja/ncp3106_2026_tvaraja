<!doctype html><html lang="en" data-bs-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request access · FlowGuard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/portal.css" rel="stylesheet"></head><body class="auth-page"><nav class="navbar app-navbar"><div class="container"><a class="navbar-brand flowguard-brand" href="index.html"><img src="assets/flowguard-logo.png" alt="FlowGuard"></a><button id="themeToggle" class="btn btn-icon" aria-label="Toggle theme"><i class="bi bi-moon-stars"></i></button><a class="btn btn-sm btn-outline-primary" href="index.html"><i class="bi bi-arrow-left me-1"></i>Public dashboard</a></div></nav><main class="container py-5"><div class="auth-card card mx-auto"><div class="card-body p-4 p-md-5"><span class="eyebrow">STAFF ACCOUNT REQUEST</span><h1 class="h2 mt-2">Request access</h1><p class="text-secondary">New accounts are pending until reviewed by a FlowGuard administrator.</p><div id="authMessage" class="alert d-none" role="status"></div><form data-auth="register"><div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" autocomplete="name" required maxlength="120"></div><div class="mb-3"><label class="form-label" for="contact_number">Contact number</label><input class="form-control" id="contact_number" name="contact_number" type="tel" autocomplete="tel" maxlength="40"></div><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><div class="form-text">Use at least 8 characters.</div></div><button class="btn btn-primary w-100 mt-2" type="submit">Submit account request</button></form><p class="small text-secondary mt-4 mb-0">Already approved? <a href="login.html">Sign in</a>.</p></div></div></main><script src="config.js"></script><script type="module" src="js/auth.js"></script></body></html>
